<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Property Management System</title>
  <link rel="icon" type="image/png" href="./RII_Logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --primary:#203c70; --accent:#fcae16; --muted:#7788a4; --error:#dc2626; }
    * { box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { margin:0; min-height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center;
      padding:24px; background:#d9d9d9; position:relative; }
    .bg-video {
      position:fixed;
      top:50%;
      left:50%;
      min-width:100%;
      min-height:100%;
      width:auto;
      height:auto;
      transform:translateX(-50%) translateY(-50%);
      z-index:0;
      object-fit:cover;
      filter:brightness(.85) saturate(1.5);
    }
    body::before, body::after { content:""; position:fixed; z-index:1; pointer-events:none; }
    body::before { width:410px; height:410px; right:-74px; top:-150px; border:3px solid #ffb400;
      border-radius:0 0 92px 0; transform:rotate(45deg); background:#1556ad;
      box-shadow:inset 0 0 0 28px #0e3c88, inset 0 0 0 31px #2389db; }
    body::after { width:180px; height:180px; left:-112px; bottom:-86px; border-radius:0 46px 0 0;
      transform:rotate(45deg); background:#0d8fc5; box-shadow:inset 0 0 0 28px #07529a, inset 0 0 0 31px #ffad00; }
    .card { position:relative; z-index:2; width:min(360px,100%); padding:24px 26px 26px; border-radius:10px;
      border-top:4px solid var(--accent); background:rgba(255,255,255,.94);
      box-shadow:0 14px 28px rgba(15,23,42,.25); }
    .brand { text-align:center; margin-bottom:20px; }
    .brand img { width:58px; height:58px; object-fit:contain; margin-bottom:8px; }
    .brand h1 { margin:0 0 4px; color:var(--primary); font-size:1.12rem; }
    .brand p { margin:0; color:var(--muted); font-size:.68rem; }
    .form-group { margin-bottom:13px; }
    label { display:block; margin-bottom:5px; color:var(--primary); font-size:.67rem; font-weight:600; }
    .input { position:relative; }
    .input i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.75rem; }
    input[type="email"], input[type="password"] { width:100%; border:1px solid #dce4ef; border-radius:6px;
      padding:9px 10px 9px 28px; background:#f7f9fc; color:#2d3748; outline:none; font-size:.72rem; }
    input:focus { border-color:var(--primary); background:white; box-shadow:0 0 0 3px rgba(30,53,95,.1); }
    .options { display:flex; justify-content:space-between; align-items:center; margin:2px 0 15px; font-size:.64rem; }
    .remember { display:flex; align-items:center; gap:5px; cursor:pointer; }
    .remember input { width:12px; height:12px; accent-color:var(--primary); }
    .forgot { border:0; background:none; color:var(--primary); font:inherit; cursor:pointer; }
    .login { width:100%; display:flex; justify-content:center; align-items:center; gap:8px; border:0;
      border-radius:6px; padding:10px; background:var(--primary); color:white; font-size:.75rem;
      font-weight:600; cursor:pointer; }
    .login:hover { background:#152748; }
    .error { display:none; align-items:center; gap:8px; margin-bottom:14px; border-radius:6px;
      padding:9px; background:rgba(239,68,68,.1); color:var(--error); font-size:.7rem; }
    .signup { margin:12px 0 0; text-align:center; color:var(--muted); font-size:.64rem; }
    .signup button { border:0; padding:0 0 0 4px; background:transparent; color:var(--primary); font:inherit;
      font-weight:600; cursor:pointer; }
    .footer { margin:14px 0 0; text-align:center; color:var(--muted); font-size:.58rem; }
    @media(max-width:480px){ body{padding:0}.card{min-height:100vh;display:flex;flex-direction:column;justify-content:center;border-radius:0;padding:32px 24px} }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="./RII_Video.mp4" type="video/mp4">
  </video>
  <section class="card" aria-labelledby="title">
    <div class="brand">
      <img src="./RII_Logo.png" alt="R-II Builders logo" />
      <h1 id="title">Welcome Back</h1>
      <p>Admin Request Management System</p>
    </div>
    <div class="error" id="error" role="alert">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errorText"></span>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input">
          <i class="fa-regular fa-envelope"></i>
          <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required />
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input">
          <i class="fa-solid fa-lock"></i>
          <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
      </div>
      <div class="options">
        <label class="remember"><input id="remember" type="checkbox" /> <span>Remember me</span></label>
        <button class="forgot" type="button" id="forgot">Forgot password?</button>
      </div>
      <button class="login" type="submit"><span>Sign In</span><i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <p class="signup">Don't have an account?<button type="button" id="signup">Sign Up</button></p>
    <p class="footer">© 2026 R-II Builders, Inc. All Rights Reserved.</p>
  </section>
  <script>
    const authKey = 'property-management-authenticated';
    const emailKey = 'property-management-email';
    const rememberedKey = 'property-management-email-remembers';
    if (sessionStorage.getItem(authKey) === 'true') {
      window.location.replace('./property_mgt_system_dahsboard.html');
    }
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const remember = document.getElementById('remember');
    const rememberedEmail = localStorage.getItem(rememberedKey);
    if (rememberedEmail) {
      email.value = rememberedEmail;
      remember.checked = true;
    }
    function showError(message) {
      document.getElementById('errorText').textContent = message;
      document.getElementById('error').style.display = 'flex';
    }
    document.getElementById('forgot').addEventListener('click', () => {
      showError('Please contact an administrator to reset your password.');
    });
    document.getElementById('signup').addEventListener('click', () => {
      showError('Please contact an administrator to create your account.');
    });
    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const normalizedEmail = email.value.trim().toLowerCase();
      const allowedDomains = ['@riibuilders.com', '@riibuilders.com.ph', '@rmrriibuilders.com', '@rmrriibuilders.com.ph'];
      if (!allowedDomains.some((domain) => normalizedEmail.endsWith(domain))) {
        showError('Use an authorized R-II Builders email address.');
        return;
      }
      if (password.value.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }
      if (remember.checked) localStorage.setItem(rememberedKey, normalizedEmail);
      else localStorage.removeItem(rememberedKey);
      sessionStorage.setItem(authKey, 'true');
      sessionStorage.setItem(emailKey, normalizedEmail);
      window.location.replace('./property_mgt_system_dahsboard.html');
    });
  </script>
</body>
</html>
